<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 980" font-family="'Cascadia Code','Consolas','SF Mono','Microsoft YaHei Mono',monospace">
  <rect width="820" height="980" rx="14" fill="#1e1e2e"/>
  <rect width="820" height="40" rx="14" fill="#181825"/>
  <rect y="26" width="820" height="14" fill="#181825"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="410" y="25" fill="#a6accd" font-size="13" text-anchor="middle">mcd-butler · 真实 demo 输出渲染（非手绘图）</text>

  <text x="28" y="74" fill="#cdd6f4" font-size="14" xml:space="preserve">  中杯可乐  ¥9.00</text>
  <text x="28" y="96" fill="#cdd6f4" font-size="14" xml:space="preserve">  麦旋风    ¥10.00</text>
  <text x="28" y="118" fill="#cdd6f4" font-size="14" xml:space="preserve">  合计      ¥56.00</text>
  <text x="28" y="140" fill="#cdd6f4" font-size="14" xml:space="preserve"></text>
  <text x="28" y="162" fill="#cdd6f4" font-size="14" xml:space="preserve">可用券（5 张）</text>
  <text x="28" y="184" fill="#cdd6f4" font-size="14" xml:space="preserve">  巨无霸立减 5 元       适用 巨无霸</text>
  <text x="28" y="206" fill="#cdd6f4" font-size="14" xml:space="preserve">  汉堡类任选 -4 元      适用 巨无霸、麦辣鸡腿堡</text>
  <text x="28" y="228" fill="#cdd6f4" font-size="14" xml:space="preserve">  小食买一送一（薯条）  适用 中份薯条</text>
  <text x="28" y="250" fill="#cdd6f4" font-size="14" xml:space="preserve">  中杯可乐立减 3 元     适用 中杯可乐</text>
  <text x="28" y="272" fill="#cdd6f4" font-size="14" xml:space="preserve">  麦旋风满 20 减 1 元   适用 麦旋风</text>
  <text x="28" y="294" fill="#cdd6f4" font-size="14" xml:space="preserve"></text>
  <text x="28" y="316" fill="#cdd6f4" font-size="14" xml:space="preserve">怎么挂最省（每张券都真实试算过）</text>
  <text x="28" y="338" fill="#cdd6f4" font-size="14" xml:space="preserve">  巨无霸    ¥25.00  ← 巨无霸立减 5 元       → ¥20.00</text>
  <text x="28" y="360" fill="#cdd6f4" font-size="14" xml:space="preserve">  中份薯条  ¥12.00  ← 小食买一送一（薯条）  → ¥ 6.00</text>
  <text x="28" y="382" fill="#cdd6f4" font-size="14" xml:space="preserve">  中杯可乐  ¥ 9.00  ← 中杯可乐立减 3 元     → ¥ 6.00</text>
  <text x="28" y="404" fill="#cdd6f4" font-size="14" xml:space="preserve">  麦旋风    ¥10.00  ← 没挂券                → ¥10.00</text>
  <text x="28" y="426" fill="#cdd6f4" font-size="14" xml:space="preserve">  ----------------------------------------------</text>
  <text x="28" y="448" fill="#cdd6f4" font-size="14" xml:space="preserve">  挂券后小计 ¥42.00</text>
  <text x="28" y="470" fill="#cdd6f4" font-size="14" xml:space="preserve">  随单购「麦金卡（随单购）」再减 ¥6.00（卡费另算）</text>
  <text x="28" y="492" fill="#cdd6f4" font-size="14" xml:space="preserve">  ----------------------------------------------</text>
  <text x="28" y="514" fill="#cdd6f4" font-size="14" xml:space="preserve">  原价 ¥56.00 → 到手 ¥36.00，省下 ¥20.00</text>
  <text x="28" y="536" fill="#cdd6f4" font-size="14" xml:space="preserve"></text>
  <text x="28" y="558" fill="#cdd6f4" font-size="14" xml:space="preserve">复刻上一单（同样的单，今天再买多少钱）</text>
  <text x="28" y="580" fill="#cdd6f4" font-size="14" xml:space="preserve"></text>
  <text x="28" y="602" fill="#cdd6f4" font-size="14" xml:space="preserve">  07-14 · 麦门管家·演示餐厅</text>
  <text x="28" y="624" fill="#cdd6f4" font-size="14" xml:space="preserve">    巨无霸 ×1          当时 ¥24.00 → 现在 ¥25.00</text>
  <text x="28" y="646" fill="#cdd6f4" font-size="14" xml:space="preserve">    中份薯条 ×1</text>
  <text x="28" y="668" fill="#cdd6f4" font-size="14" xml:space="preserve">    中杯可乐 ×1</text>
  <text x="28" y="690" fill="#cdd6f4" font-size="14" xml:space="preserve">    上次实付 ¥33.00 → 今天 ¥26.00，便宜了 ¥7.00</text>
  <text x="28" y="712" fill="#6c7086" font-size="14" xml:space="preserve">    （用了 3 张券 + 麦金卡（随单购））</text>
  <text x="28" y="734" fill="#cdd6f4" font-size="14" xml:space="preserve"></text>
  <text x="28" y="756" fill="#cdd6f4" font-size="14" xml:space="preserve">  09-02 · 麦门管家·演示餐厅</text>
  <text x="28" y="778" fill="#cdd6f4" font-size="14" xml:space="preserve">    麦辣鸡腿堡 ×1</text>
  <text x="28" y="800" fill="#cdd6f4" font-size="14" xml:space="preserve">    麦旋风 ×1</text>
  <text x="28" y="822" fill="#cdd6f4" font-size="14" xml:space="preserve">    上次实付 ¥30.00 → 今天 ¥26.00，便宜了 ¥4.00</text>
  <text x="28" y="844" fill="#6c7086" font-size="14" xml:space="preserve">    （用了 1 张券 + 麦金卡（随单购））</text>
  <text x="28" y="866" fill="#cdd6f4" font-size="14" xml:space="preserve"></text>
  <text x="28" y="888" fill="#cdd6f4" font-size="14" xml:space="preserve">  就这两段：把购物车和券丢进来，算出怎么挂最省。</text>
  <text x="28" y="910" fill="#cdd6f4" font-size="14" xml:space="preserve">  还有黄历 / 券包体检 / 活动日历 / 段位，想看就跑：</text>
  <text x="28" y="932" fill="#cdd6f4" font-size="14" xml:space="preserve">    python -m src.cli demo --all</text>
</svg>
